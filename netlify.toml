[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# These two functions require() src/lib/artwork-pricing.mjs, the ES module the
# Astro pages also import. esbuild bundles it into each function at build time,
# so the deployed function does not depend on the runtime's require(esm).
[functions."create-checkout"]
  node_bundler = "esbuild"

[functions."stripe-webhook"]
  node_bundler = "esbuild"

# Printful mockups are served through Netlify Image CDN (/.netlify/images?url=…),
# so visitors load them from labrats.uk, resized, and never contact printful.com.
[images]
  remote_images = ['https://files\.cdn\.printful\.com/.*']

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Nothing on the site uses the camera or microphone.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    # Report-only for now: violations appear in the browser console; nothing is blocked.
    # Google hosts: GA4, loaded only after cookie consent (src/lib/analytics.ts).
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; connect-src 'self' https://cdn.sanity.io https://*.api.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://cdn.sanity.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/product/*"
  to = "/products/:splat"
  status = 301
  force = true

# Retired duplicate product pages (an old flat-model template that rendered
# "Image Coming Soon"): straight to the real product page, trailing slash.
[[redirects]]
  from = "/shop/:slug/"
  to = "/products/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/shop/:slug"
  to = "/products/:slug/"
  status = 301
  force = true

# Old standalone privacy page replaced by the Sanity-managed legal page.
[[redirects]]
  from = "/privacy"
  to = "/legal/privacy-policy/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/legal/privacy-policy/"
  status = 301
  force = true

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ── Vent Runner (public/games/vent-runner/) ───────────────────────────────
# The game's static assets: a week in the browser cache.
[[headers]]
  for = "/games/vent-runner/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/vent-runner/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/games/vent-runner/tex/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/vent-runner/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/vent-runner/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/vent-runner/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The game page is shown in an iframe on /games/vent-runner/, but "/*" above
# sends X-Frame-Options: DENY, which refuses framing even by this site.
# Netlify merges every matching rule, so a second X-Frame-Options here would be
# joined to DENY as a conflicting pair, which browsers treat as a block.
# Instead: an enforced CSP that only sets frame-ancestors. Browsers obey
# frame-ancestors in place of X-Frame-Options, and it allows this site alone.
[[headers]]
  for = "/games/vent-runner/play/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
