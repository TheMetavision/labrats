[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Printful mockups are served through Netlify Image CDN (/.netlify/images?url=…),
# so visitors load them from labrats.uk, resized, and never contact printful.com.
[images]
  remote_images = ['https://files\.cdn\.printful\.com/.*']

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/product/*"
  to = "/products/:splat"
  status = 301
  force = true

# Old standalone privacy page replaced by the Sanity-managed legal page.
[[redirects]]
  from = "/privacy"
  to = "/legal/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/legal/privacy-policy"
  status = 301
  force = true
